aid: scopio-scopio-llc
name: Scopio, Scopio LLC
description: >-
  Scopio (Scopio LLC) is a New York-based global visual-content marketplace and
  creative-talent platform, founded in 2017 and backed by 500 Global. It connects
  businesses with a network of 25,000+ vetted photographers and visual artists across
  172 countries and a library of more than three million authentic, diverse stock
  images that can be licensed under standard, extended, and editorial licenses. Brands
  including Disney, Microsoft, and Meta use Scopio to hire creative talent and source
  unique imagery, with AI used to sort, tag, title, and feature contributed work.
  Scopio operates as a consumer- and business-facing web and mobile marketplace
  (Shopify-hosted storefront plus iOS/Android artist apps); it does not currently
  publish a public developer API, SDK, or developer portal.
